<script src="js/bootstrap.bundle.min.js"></script>
<script>
  var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
  var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
    return new bootstrap.Tooltip(tooltipTriggerEl)
  })
</script>
<div class="container my-5" >
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card shadow p-4" style="background-color: #a8bae6;">
        <h2 class="text-center mb-4">Registro de Estudiante</h2>

        <form action="registroES.php" method="POST">

          <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">ID del Estudiante: (Maximo 4 digitos)</label>
              <input type="text" name="IDUsuario" class="form-control" required  minlength="4" maxlength="4" data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa 4 digitos para el ID de estudiante.">
           </div>
            
            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Nombre del Estudiante:</label>
              <input type="text" name="Nombre" class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa solo el nombre del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Apellido Paterno del Estudiante:</label>
              <input type="text" name="ApellidoPaterno"class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa solo el primer apellido del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Apellido Materno del Estudiante:</label>
              <input type="text" name="ApellidoMaterno" class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa solo el apellido materno del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Edad del Estudiante:</label>
              <input type="number" name="Edad" class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa la edad del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Sexo:</label>
              <select name="sexo" class="form-select" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Selecciona tu sexo">
                <option value="">Selecciona una opción</option>
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Correo electrónico del Estudiante:</label>
              <input type="email" name="Email" class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa el email del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Telefono del Estudiante:</label>
              <input type="text" name="Telefono" class="form-control" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa el telefono del estudiante">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Tipo de usuario:</label>
              <select name="tipoUsuario" class="form-select" required data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Selecciona ES si eres estudiante">
                <option value="">Selecciona una opcion</option>
                <option value="es">ES</option>
                <option value="ce" disabled>CE "no disponible para este usuario"</option>
              </select>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Contraseña:</label>
              <input type="password" name="Password" class="form-control" required minlength="8" data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Ingresa minimo 8 caracteres incluye, letras, números y símbolo.">
            </div>

            <div class="col-12 col-md-6 col-lg-4">
              <label class="form-label">Confirmar Contraseña:</label>
              <input type="password" name="confirmar" class="form-control" required minlength="8" data-bs-toggle="tooltip" data-bs-trigger="focus" data-bs-placement="right"
    title="Confirma tu contraseña." >
            </div>

          </div>

          <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5">Guardar Registro del Estudiante</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

</body>
